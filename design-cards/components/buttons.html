<!-- @dsCard group="Components" name="Buttons" -->
<!doctype html>
<html><head><meta charset="utf-8"><style>
  body{font-family:'Montserrat',system-ui,sans-serif;margin:0;padding:0;background:#fff}
  .half{padding:26px 28px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
  .dark{background:#0a0f1a}
  .btn{border-radius:999px;padding:14px 26px;font-weight:600;font-size:15px;border:0;cursor:pointer;display:inline-flex;align-items:center;gap:8px}
  .primary{background:#dc2626;color:#fff;box-shadow:0 8px 20px rgba(220,38,38,.28)}
  .primary:hover{background:#b91c1c}
  .outline-dark{background:rgba(255,255,255,.05);color:#fff;border:1px solid rgba(255,255,255,.3);backdrop-filter:blur(4px)}
  .ghost-light{background:transparent;color:#1e293b;border:1px solid #e2e8f0}
  .link{background:none;color:#dc2626;padding:14px 6px}
  .cap{font-size:11px;color:#94a3b8;text-transform:uppercase;letter-spacing:.1em;padding:10px 28px 0}
</style></head><body>
<div class="cap">On light</div>
<div class="half">
  <button class="btn primary">Book a Detail →</button>
  <button class="btn ghost-light">View packages</button>
  <button class="btn link">Chat on WhatsApp →</button>
</div>
<div class="cap" style="background:#0a0f1a;color:#64748b;margin:0;padding-top:20px">On dark</div>
<div class="half dark">
  <button class="btn primary">Explore our services →</button>
  <button class="btn outline-dark">Book a Detail</button>
</div>
</body></html>
